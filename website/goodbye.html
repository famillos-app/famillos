<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorry to see you go — Famillos</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.png">
  <style>
    body { font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f2e38; background: #fdf8f1; margin: 0; }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
    h1 { font-size: 34px; letter-spacing: -.02em; line-height: 1.15; margin: 24px 0 8px; }
    label { display: flex; gap: 10px; align-items: center; background: #fff; border: 1.5px solid #ece3d6; border-radius: 14px; padding: 12px 14px; margin: 8px 0; cursor: pointer; }
    textarea { width: 100%; box-sizing: border-box; border: 1.5px solid #ece3d6; border-radius: 14px; padding: 12px; font: inherit; margin-top: 8px; }
    button { margin-top: 14px; background: #ff6f5b; color: #fff; border: 0; border-radius: 14px; padding: 13px 20px; font: 700 16px system-ui; cursor: pointer; }
    .ok { color: #16a67a; font-weight: 700; }
    a { color: #2e7590; }
  </style>
</head>
<body>
<main>
  <a href="/"><img src="assets/logo.svg" width="44" height="44" alt="Famillos"></a>
  <h1>Sorry to see you go 👋</h1>
  <p>Your data has been removed from this browser. One quick question helps us make Famillos better for the next family:</p>
  <form id="f">
    <label><input type="radio" name="why" value="not-needed"> I don't need it any more</label>
    <label><input type="radio" name="why" value="missing-feature"> It was missing something I need</label>
    <label><input type="radio" name="why" value="didnt-work"> It didn't work on a shop I use</label>
    <label><input type="radio" name="why" value="phone"> I'd rather use my phone</label>
    <label><input type="radio" name="why" value="other"> Something else</label>
    <textarea name="more" rows="3" placeholder="Anything else? (optional)"></textarea>
    <button>Send feedback</button>
    <p id="msg"></p>
  </form>
  <p>Changed your mind? You can keep using Famillos on your phone at <a href="/app/">famillos.com/app</a>.</p>
</main>
<script src="config.js"></script>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var d = new FormData(e.target), body = { why: d.get("why") || "", more: d.get("more") || "", source: "uninstall" };
    window.FM_READY.then(function (C) {
      var done = function () { e.target.innerHTML = '<p class="ok">Thank you — that really helps.</p>'; };
      if (!C.leadFormEndpoint) { location.href = "mailto:" + (C.contactEmail || "hello@famillos.com") + "?subject=Famillos%20feedback&body=" + encodeURIComponent(body.why + "\n" + body.more); return; }
      fetch(C.leadFormEndpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) }).then(done, done);
    });
  });
</script>
</body>
</html>
