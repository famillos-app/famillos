name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Refresh deals
        run: node scripts/update-deals.mjs
        env:
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}
      - name: Build mobile web app
        run: node scripts/build-webapp.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: website }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
